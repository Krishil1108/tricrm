<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Glowing Hexagonal Shield -->
  <path d="M256 64 L416 144 V288 C416 384 344 448 256 480 C168 448 96 384 96 288 V144 Z" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.95" />
  
  <!-- Inner Dynamic T-Geometric Brand Symbol -->
  <path d="M160 176 H352 V224 H288 V368 H224 V224 H160 Z" fill="url(#tGrad)" />
  
  <!-- Subtle Spark Core Accent -->
  <circle cx="256" cy="392" r="14" fill="#60a5fa" />
</svg>
