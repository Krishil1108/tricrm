<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="MERN Stack Application"
    />
    
    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- DNS prefetch for even faster domain resolution -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <!-- Deferred Bootstrap Icons - loads after critical content -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></noscript>
    
    <!-- Optimized Inter Font with font-display swap to prevent render blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
    
    <title>Trimity CRM</title>
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 50%, #1e1e38 0%, #0f0f1d 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #loading-screen.hidden {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 60px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .loading-brand-icon {
        position: relative;
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading-brand-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #6366f1;
        border-right-color: #a855f7;
        animation: spinGlow 1.2s linear infinite;
      }
      .loading-brand-ring-inner {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-bottom-color: #3b82f6;
        border-left-color: #06b6d4;
        animation: spinGlowReverse 1.8s linear infinite;
      }
      @keyframes spinGlow {
        to { transform: rotate(360deg); }
      }
      @keyframes spinGlowReverse {
        to { transform: rotate(-360deg); }
      }
      .loading-text {
        font-size: 26px;
        font-weight: 700;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      .loading-subtitle {
        font-size: 13px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      .loading-bar-container {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .loading-bar-progress {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #6366f1, #a855f7, transparent);
        animation: shimmerProgress 1.6s ease-in-out infinite;
      }
      @keyframes shimmerProgress {
        0% { left: -100%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="loading-screen">
      <div class="loading-card">
        <div class="loading-brand-icon">
          <div class="loading-brand-ring"></div>
          <div class="loading-brand-ring-inner"></div>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="#a855f7">
            <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
          </svg>
        </div>
        <div class="loading-text">Trimity CRM</div>
        <div class="loading-subtitle">Enterprise Suite</div>
        <div class="loading-bar-container">
          <div class="loading-bar-progress"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
