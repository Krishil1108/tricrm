# Render deployment configuration
# This file helps Render understand how to deploy your application

services:
  # Backend service that also serves the frontend in production
  - type: web
    name: tricrm-backend
    env: node
    region: oregon
    plan: starter  # Free tier: starter, Paid: standard/pro
    buildCommand: |
      cd frontend && npm ci && npm run build
      cd ../backend && npm ci --production --silent
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: tricrm-backend
          property: port
    # Add your environment variables in Render dashboard:
    # MONGODB_URI, JWT_SECRET, EMAIL_* variables
    
    healthCheckPath: /api/health
    
    # Auto-deploy on every push to main branch
    autoDeploy: true

